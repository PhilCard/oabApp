<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tabela com Ações</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9fafb;
      padding: 40px;
      color: #1e293b;
    }

    .search-bar {
      max-width: 500px;
      margin: 0 auto 30px;
      display: flex;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
      transition: border 0.3s;
    }

    .search-bar input:focus {
      border-color: #3b82f6;
      outline: none;
    }

    .table-container {
      max-width: 1000px;
      margin: 0 auto;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      background-color: white;
    }

    thead {
      background-color: #111827;
      color: white;
    }

    th, td {
      padding: 16px;
      text-align: left;
      font-size: 15px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
      
    }

    .action-btn {
      padding: 8px 12px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 6px;
      transition: background 0.3s ease;
    }

    .edit-btn {
      background-color: #3b82f6;
      color: white;
    }

    .edit-btn:hover {
      background-color: #2563eb;
    }

    .delete-btn {
      background-color: #ef4444;
      color: white;
    }

    .delete-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="search-bar">
    <input type="text" placeholder="Pesquisar disciplina...">
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Disciplina</th>
          <th>Assunto</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Direito Constitucional</td>
          <td>Controle de Constitucionalidade</td>
          <td>07/05/2025</td>
          <td>
            <button class="action-btn edit-btn">Editar</button>
            <button class="action-btn delete-btn">Excluir</button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Ética Profissional</td>
          <td>Prerrogativas do Advogado</td>
          <td>08/05/2025</td>
          <td>
            <button class="action-btn edit-btn">Editar</button>
            <button class="action-btn delete-btn">Excluir</button>
          </td>
        </tr>
        <tr>
          <td>3</td>
          <td>Direito Penal</td>
          <td>Crimes contra a vida</td>
          <td>10/05/2025</td>
          <td>
            <button class="action-btn edit-btn">Editar</button>
            <button class="action-btn delete-btn">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
